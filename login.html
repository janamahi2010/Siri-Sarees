<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
}

/* LEFT SIDE */
.left{
    width:70%;
    background:url("https://static.wixstatic.com/media/60b717_313c72edefe847a1a68f468a6e99caad~mv2.jpg/v1/fill/w_670,h_502,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/60b717_313c72edefe847a1a68f468a6e99caad~mv2.jpg")
    no-repeat center center/cover;
    position:relative;
    color:white;
}

.brand{
    position:absolute;
    top:20px;
    left:25px;
    font-size:36px;
    font-weight:900;
    padding:8px 16px;
    background:#966919;
    border-left:6px solid #ffd54f;
    border-radius:8px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.left-text{
    position:absolute;
    top:40%;
    left:12%;
    font-size:30px;
    line-height:1.4;
}

/* RIGHT SIDE */
.right{
    width:30%;
    background:#966919;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:380px;
    background:white;
    padding:40px;
    border-radius:40px 0 40px 0;
}

.card h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.field{
    margin-bottom:20px;
}

.field input{
    width:100%;
    border:none;
    border-bottom:2px solid #999;
    padding:10px 5px;
    font-size:14px;
    outline:none;
}

.primary-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#966919;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

.primary-btn:hover{
    opacity:0.9;
}

.hint{
    color:red;
    font-size:12px;
    margin-top:5px;
}

.login-text{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.login-text a{
    text-decoration:none;
    color:#966919;
    font-weight:bold;
}

.error-border{
    border-bottom:2px solid red !important;
}

.forgot{
    text-align:right;
    margin-top:-10px;
    margin-bottom:20px;
}

.forgot a{
    text-decoration:none;
    color:#966919;
    font-size:14px;
}

.otp-text{
    text-align:center;
    margin-top:15px;
    margin-bottom:15px;
    color:#555;
}
</style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left">

    <div class="brand">
        Siri Saree Divine
    </div>

    <div class="left-text">
        <b>
            Grace in every pleat,<br>
            magic in every drape.
        </b>
    </div>

</div>

<!-- RIGHT SIDE -->
<div class="right">

    <div class="card">

        <h2>Login</h2>

        <!-- Mobile Number / Email -->
        <div class="field">
            <input type="text"
                   id="loginId"
                   placeholder="Mobile Number / Email">

            <p class="hint"
               id="loginError"
               style="display:none;">
               Please enter mobile number or email.
            </p>
        </div>

        <!-- Password -->
        <div class="field">
            <input type="password"
                   id="password"
                   placeholder="Password">

            <p class="hint"
               id="passwordError"
               style="display:none;">
               Please enter password.
            </p>
        </div>

        <!-- Forgot Password -->
        <div class="forgot">
            <a href="forgot.html">Forgot Password?</a>
        </div>

        <!-- Login Button -->
        <div class="field">
            <button class="primary-btn"
                    onclick="loginUser()">
                LOGIN
            </button>
        </div>

        <!-- OTP Login -->
        <div class="otp-text">
            Or Login with OTP
        </div>

        <!-- Signup Link -->
        <p class="login-text">
            Don't have an Account?
            <a href="signup.html">Signup</a>
        </p>

    </div>

</div>

<script>

function loginUser(){

    let loginId =
        document.getElementById("loginId")
        .value.trim();

    let password =
        document.getElementById("password")
        .value.trim();

    let valid = true;

    if(loginId === ""){
        document.getElementById("loginError")
                .style.display = "block";
        document.getElementById("loginId")
                .classList.add("error-border");
        valid = false;
    }
    else{
        document.getElementById("loginError")
                .style.display = "none";
        document.getElementById("loginId")
                .classList.remove("error-border");
    }

    if(password === ""){
        document.getElementById("passwordError")
                .style.display = "block";
        document.getElementById("password")
                .classList.add("error-border");
        valid = false;
    }
    else{
        document.getElementById("passwordError")
                .style.display = "none";
        document.getElementById("password")
                .classList.remove("error-border");
    }

    if(valid){
        alert("Login Successful!");
    }
}

</script>

</body>
</html>
