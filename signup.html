<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .modal {
      position: relative;
      background: #fff;
      border-radius: 10px;
      padding: 36px 40px 28px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #374151;
    }

    h2 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
    }

    hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      color: #374151;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #9333ea;
    }

    input.error-border {
      border-color: #e53e3e;
    }

    .hint {
      font-size: 12px;
      color: #e53e3e;
      margin-top: 5px;
    }

    .hint.info {
      color: #6b7280;
    }

    .hint.success {
      color: #2d6a4f;
    }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .primary-btn {
      background: #7B4B2A;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px 28px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s;
    }

    .primary-btn:hover {
      background: #5a3520;
    }

    .login-text {
      text-align: center;
      font-size: 14px;
      color: #374151;
    }

    .login-text a {
      color: #e53e3e;
      text-decoration: none;
      font-weight: 500;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    #otp-field {
      display: none;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="modal">
    <button class="close-btn" onclick="alert('Closed')">✕</button>
    <h2>Signup</h2>
    <hr />

    <!-- Full Name -->
    <div class="field">
      <input type="text" id="fullName" placeholder="Full Name*" />
      <p class="hint" id="nameError" style="display:none;">Full name is required.</p>
    </div>

    <!-- Email -->
    <div class="field">
      <input type="email" id="email" placeholder="Email Address*" />
      <p class="hint" id="emailError" style="display:none;">Enter a valid email address.</p>
    </div>

    <!-- Mobile -->
    <div class="field">
      <input type="tel" id="mobile" placeholder="Mobile Number*" maxlength="10" />
      <p class="hint info">Please enter mobile number without country code. (Ex: 9876543210)</p>
      <p class="hint" id="mobileError" style="display:none;">Enter a valid 10-digit mobile number.</p>
    </div>

    <!-- OTP Field (hidden initially) -->
    <div id="otp-field" class="field">
      <input type="text" id="otp" placeholder="Enter OTP" maxlength="6" />
      <p class="hint success" id="otpHint"></p>
    </div>

    <!-- Button -->
    <div class="btn-row">
      <button class="primary-btn" id="actionBtn" onclick="handleAction()">SEND OTP</button>
    </div>

    <p class="login-text">Do you have an Account? <a href="login.html">Login</a></p>
  </div>

  <script>
    let otpSent = false;

    function handleAction() {
      if (!otpSent) {
        sendOtp();
      } else {
        verifyOtp();
      }
    }

    function sendOtp() {
      let valid = true;

      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const mobile = document.getElementById('mobile').value.trim();

      // Name
      if (!name) {
        showError('fullName', 'nameError');
        valid = false;
      } else {
        clearError('fullName', 'nameError');
      }

      // Email (optional but validate if provided)
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('email', 'emailError');
        valid = false;
      } else {
        clearError('email', 'emailError');
      }

      // Mobile
      if (!mobile || !/^\d{10}$/.test(mobile)) {
        showError('mobile', 'mobileError');
        valid = false;
      } else {
        clearError('mobile', 'mobileError');
      }

      if (!valid) return;

      // Show OTP field
      const otpField = document.getElementById('otp-field');
      otpField.style.display = 'block';
      document.getElementById('otpHint').textContent = 'OTP sent to +91 ' + mobile;
      document.getElementById('actionBtn').textContent = 'VERIFY OTP';
      otpSent = true;
    }

    function verifyOtp() {
      const otp = document.getElementById('otp').value.trim();
      if (!otp || otp.length < 4) {
        alert('Please enter the OTP sent to your mobile.');
        return;
      }
      alert('OTP verified! Signup successful.');
    }

    function showError(inputId, errorId) {
      document.getElementById(inputId).classList.add('error-border');
      document.getElementById(errorId).style.display = 'block';
    }

    function clearError(inputId, errorId) {
      document.getElementById(inputId).classList.remove('error-border');
      document.getElementById(errorId).style.display = 'none';
    }

    // Clear errors on input
    ['fullName', 'email', 'mobile'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('error-border');
        const errMap = { fullName: 'nameError', email: 'emailError', mobile: 'mobileError' };
        document.getElementById(errMap[id]).style.display = 'none';
      });
    });
  </script>

</body>
</html>
