<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
}

/* LEFT SIDE */
.left{
    width:70%;
    background:url("https://static.wixstatic.com/media/60b717_313c72edefe847a1a68f468a6e99caad~mv2.jpg/v1/fill/w_670,h_502,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/60b717_313c72edefe847a1a68f468a6e99caad~mv2.jpg")
    no-repeat center center/cover;
    position:relative;
    color:white;
}

.brand{
    position:absolute;
    top:20px;
    left:25px;
    font-size:36px;
    font-weight:900;
    padding:8px 16px;
    background:#966919;
    border-left:6px solid #ffd54f;
    border-radius:8px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.left-text{
    position:absolute;
    top:40%;
    left:12%;
    font-size:30px;
    line-height:1.4;
}

/* RIGHT SIDE */
.right{
    width:30%;
    background:#966919;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:380px;
    background:white;
    padding:40px;
    border-radius:40px 0 40px 0;
}

.card h2{
    text-align:center;
    margin-bottom:30px;
}

.field{
    margin-bottom:20px;
}

.field input{
    width:100%;
    border:none;
    border-bottom:2px solid #999;
    padding:10px 5px;
    font-size:14px;
    outline:none;
}

.primary-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#966919;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

.primary-btn:hover{
    opacity:0.9;
}

.hint{
    color:red;
    font-size:12px;
    margin-top:5px;
}

.success{
    color:green;
}

.login-text{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.login-text a{
    text-decoration:none;
    color:#966919;
    font-weight:bold;
}

.error-border{
    border-bottom:2px solid red !important;
}
</style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left">

    <div class="brand">
        Siri Saree Divine
    </div>

    <div class="left-text">
        <b>
            Grace in every pleat,<br>
            magic in every drape.
        </b>
    </div>

</div>

<!-- RIGHT SIDE -->
<div class="right">

    <div class="card">

        <h2>Sign Up</h2>

        <!-- Full Name -->
        <div class="field">
            <input type="text"
                   id="fullName"
                   placeholder="Full Name*">

            <p class="hint"
               id="nameError"
               style="display:none;">
               Full name is required.
            </p>
        </div>

        <!-- Phone Number -->
        <div class="field">
            <input type="tel"
                   id="mobile"
                   placeholder="Phone Number*"
                   maxlength="10">

            <p class="hint"
               id="mobileError"
               style="display:none;">
               Enter a valid 10-digit phone number.
            </p>
        </div>

        <!-- Button -->
        <div class="field">
            <button class="primary-btn"
                    id="actionBtn"
                    onclick="handleAction()">
                SEND OTP
            </button>
        </div>

        <!-- OTP FIELD -->
        <div class="field"
             id="otp-field"
             style="display:none;">

            <input type="text"
                   id="otp"
                   placeholder="Enter OTP"
                   maxlength="6">

            <p class="success"
               id="otpHint"></p>
        </div>

        <p class="login-text">
            Do you have an Account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script>

let otpSent = false;

function handleAction(){
    if(!otpSent){
        sendOtp();
    }
    else{
        verifyOtp();
    }
}

function sendOtp(){

    let valid = true;

    const name =
        document.getElementById("fullName")
        .value.trim();

    const mobile =
        document.getElementById("mobile")
        .value.trim();

    /* Name Validation */
    if(name === ""){
        showError("fullName","nameError");
        valid = false;
    }
    else{
        clearError("fullName","nameError");
    }

    /* Mobile Validation */
    if(!/^\d{10}$/.test(mobile)){
        showError("mobile","mobileError");
        valid = false;
    }
    else{
        clearError("mobile","mobileError");
    }

    if(!valid){
        return;
    }

    /* Show OTP Field */
    document.getElementById("otp-field")
            .style.display = "block";

    document.getElementById("otpHint")
            .innerHTML =
            "OTP sent to +91 " + mobile;

    document.getElementById("actionBtn")
            .innerHTML =
            "VERIFY OTP";

    otpSent = true;
}

function verifyOtp(){

    const otp =
        document.getElementById("otp")
        .value.trim();

    if(otp.length !== 6){
        alert("Please enter a valid 6-digit OTP");
        return;
    }

    alert("OTP Verified! Signup Successful.");
}

function showError(inputId,errorId){

    document.getElementById(inputId)
            .classList.add("error-border");

    document.getElementById(errorId)
            .style.display = "block";
}

function clearError(inputId,errorId){

    document.getElementById(inputId)
            .classList.remove("error-border");

    document.getElementById(errorId)
            .style.display = "none";
}

/* Remove Errors While Typing */
["fullName","mobile"].forEach(id => {

    document.getElementById(id)
    .addEventListener("input", function(){

        this.classList.remove("error-border");

        if(id === "fullName"){
            document.getElementById("nameError")
                    .style.display = "none";
        }

        if(id === "mobile"){
            document.getElementById("mobileError")
                    .style.display = "none";
        }

    });

});

</script>

</body>
</html>
